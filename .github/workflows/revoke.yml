name: Revoke a build

# Removes a version from both channels and lists it as revoked in each, so
# launchers running it move to the newest build they can run, whichever
# channel they follow. It also turns the version's GitHub release back into a
# prerelease, so the legacy updater and Sparkle stop offering it.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to revoke, A.B.C.D"
        required: true
        type: string

permissions:
  contents: read

jobs:
  tool:
    uses: ./.github/workflows/manifest-tool.yml
    permissions:
      contents: read
      packages: write

  revoke:
    needs: tool
    permissions:
      contents: write
    runs-on: windows-latest
    environment: update-signing
    concurrency:
      group: update-channels
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v7
        with:
          name: manifest-tool
          path: tool

      - name: Revoke, sign, verify and publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TOOL: tool/parties_manifest_tool.exe
          VERSION: ${{ inputs.version }}
          PARTIES_UPDATE_KEY: ${{ secrets.PARTIES_UPDATE_KEY }}
          PARTIES_UPDATE_KEY_NEXT: ${{ secrets.PARTIES_UPDATE_KEY_NEXT }}
        run: bash tools/release/channels.sh revoke "$VERSION"
