name: Re-sign channels

# Manifests expire 45 days after they are signed, and an expired manifest
# stops update offers while running builds keep working. This refreshes the
# serial and expiry of both channels every week without changing any build.

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tool:
    uses: ./.github/workflows/manifest-tool.yml
    permissions:
      contents: read
      packages: write

  resign:
    needs: tool
    permissions:
      contents: write
    runs-on: windows-latest
    environment: update-signing
    concurrency:
      group: update-channels
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v7
        with:
          name: manifest-tool
          path: tool

      - name: Re-sign, verify and publish both channels
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TOOL: tool/parties_manifest_tool.exe
          PARTIES_UPDATE_KEY: ${{ secrets.PARTIES_UPDATE_KEY }}
          PARTIES_UPDATE_KEY_NEXT: ${{ secrets.PARTIES_UPDATE_KEY_NEXT }}
        run: bash tools/release/channels.sh resign
